<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Yixin Cui's interactive portfolio across learning, international work, and creative practice."
    />
    <meta name="theme-color" content="#171717" />
    <title>yixincui_chill · Personal Website</title>
    <link rel="icon" href="assets/favicon.svg" type="image/svg+xml" />
    <link rel="preload" href="assets/homepage-room-v12.png" as="image" />
    <link rel="preload" href="assets/create-portrait-v1.png" as="image" />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <a class="skip-link" href="#book-stage">Skip to the book</a>

    <main class="app-shell" id="app">
      <div class="ambient-glow ambient-glow--rose" aria-hidden="true"></div>
      <div class="ambient-glow ambient-glow--blue" aria-hidden="true"></div>

      <section class="book-stage" id="book-stage" aria-live="polite" tabindex="-1">
        <div class="book" id="book">
          <div class="book-shadow" aria-hidden="true"></div>
          <div class="book-content" id="book-content"></div>
          <div class="book-page-stack" aria-hidden="true"></div>
          <span class="page-grab-hint page-grab-hint--left" aria-hidden="true">‹</span>
          <span class="page-grab-hint page-grab-hint--right" aria-hidden="true">›</span>
          <div class="page-turn-stationary" aria-hidden="true">
            <div class="page-turn__snapshot"></div>
          </div>
          <div class="page-turn-shadow" aria-hidden="true"></div>
          <div class="page-turn page-turn--next" aria-hidden="true">
            <div class="page-turn__face page-turn__face--front">
              <div class="page-turn__snapshot"></div>
            </div>
            <div class="page-turn__face page-turn__face--back">
              <div class="page-turn__snapshot"></div>
            </div>
            <span class="page-turn__curl"></span>
          </div>
          <div class="page-turn page-turn--prev" aria-hidden="true">
            <div class="page-turn__face page-turn__face--front">
              <div class="page-turn__snapshot"></div>
            </div>
            <div class="page-turn__face page-turn__face--back">
              <div class="page-turn__snapshot"></div>
            </div>
            <span class="page-turn__curl"></span>
          </div>
        </div>
      </section>

      <div class="reader-controls" id="reader-controls" hidden>
        <button class="reader-button" id="prev-page" type="button" aria-label="Previous page">
          <span aria-hidden="true">←</span>
          <span data-i18n="previous">Previous</span>
        </button>
        <p class="page-status" id="page-status" aria-live="polite"></p>
        <button class="reader-button" id="next-page" type="button" aria-label="Next page">
          <span data-i18n="next">Next</span>
          <span aria-hidden="true">→</span>
        </button>
      </div>
    </main>

    <dialog class="resume-drawer" id="resume-drawer" aria-labelledby="resume-title">
      <div class="drawer-handle" aria-hidden="true"></div>
      <button class="drawer-close" id="drawer-close" type="button" aria-label="Close resume">×</button>
      <div id="resume-content"></div>
    </dialog>

    <noscript>
      <p class="noscript-message">This interactive portfolio needs JavaScript. You can still download the <a href="assets/Cui-Yixin-CV.pdf">PDF resume</a>.</p>
    </noscript>

    <!-- StPageFlip 2.0.7 (MIT): assets/vendor/page-flip.LICENSE.txt -->
    <script src="assets/vendor/page-flip.browser.js"></script>
    <script src="site-data.js"></script>
    <script src="app.js"></script>
  </body>
</html>
